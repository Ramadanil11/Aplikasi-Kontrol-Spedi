<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 26px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #475569; }
      .lane-title { font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 700; fill: #0f172a; }
      .node-text { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .small-text { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #334155; text-anchor: middle; dominant-baseline: middle; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #334155; }
      .panel { fill: #ffffff; stroke: #1e293b; stroke-width: 2; }
      .lane-line { stroke: #cbd5e1; stroke-width: 1.4; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .soft-flow { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow); stroke-dasharray: 6 5; }
      .label-bg { fill: #ffffff; opacity: 0.94; }
      .app { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .backend { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .firmware { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .monitor { fill: #f0fdfa; stroke: #0f766e; stroke-width: 2; }
      .decision { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .warn { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .rth { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="1500" fill="#f8fafc"/>
  <text x="60" y="48" class="title">Cara Kerja SPEDI - Flowchart dengan RTH</text>
  <text x="60" y="72" class="subtitle">Versi baru: menambahkan Return To Home (RTH) dari fitur aplikasi/firmware tanpa menimpa file lama.</text>

  <rect x="40" y="95" width="1520" height="1340" rx="8" class="panel"/>
  <line x1="40" y1="145" x2="1560" y2="145" class="lane-line"/>
  <line x1="380" y1="95" x2="380" y2="1435" class="lane-line"/>
  <line x1="720" y1="95" x2="720" y2="1435" class="lane-line"/>
  <line x1="1120" y1="95" x2="1120" y2="1435" class="lane-line"/>

  <text x="210" y="128" class="lane-title" text-anchor="middle">Pengguna / Aplikasi Flutter</text>
  <text x="550" y="128" class="lane-title" text-anchor="middle">Backend / API / MQTT</text>
  <text x="920" y="128" class="lane-title" text-anchor="middle">Firmware Kapal ESP32</text>
  <text x="1340" y="128" class="lane-title" text-anchor="middle">Monitoring Aplikasi</text>

  <rect x="90" y="170" width="240" height="56" rx="7" class="app"/>
  <text x="210" y="190" class="node-text">Aplikasi dibuka</text>
  <text x="210" y="211" class="node-text">dan auto-login</text>

  <rect x="430" y="170" width="240" height="56" rx="7" class="backend"/>
  <text x="550" y="190" class="node-text">Buka session</text>
  <text x="550" y="211" class="node-text">device SPEDI</text>

  <rect x="430" y="255" width="240" height="56" rx="7" class="backend"/>
  <text x="550" y="275" class="node-text">Connect WebSocket,</text>
  <text x="550" y="296" class="node-text">MQTT, telemetry</text>

  <polygon points="550,350 655,405 550,460 445,405" class="decision"/>
  <text x="550" y="395" class="node-text">Koneksi</text>
  <text x="550" y="416" class="node-text">siap?</text>

  <rect x="790" y="365" width="240" height="56" rx="7" class="warn"/>
  <text x="910" y="386" class="node-text">Tampilkan error</text>
  <text x="910" y="406" class="node-text">koneksi</text>

  <polygon points="210,350 315,405 210,460 105,405" class="decision"/>
  <text x="210" y="395" class="node-text">Operator</text>
  <text x="210" y="416" class="node-text">pilih mode?</text>

  <rect x="90" y="510" width="240" height="56" rx="7" class="app"/>
  <text x="210" y="538" class="node-text">Mode MANUAL</text>

  <rect x="430" y="510" width="240" height="56" rx="7" class="backend"/>
  <text x="550" y="531" class="node-text">Kirim joystick</text>
  <text x="550" y="551" class="node-text">throttle / steering</text>

  <rect x="790" y="510" width="260" height="56" rx="7" class="firmware"/>
  <text x="920" y="531" class="node-text">ESP32 baca</text>
  <text x="920" y="551" class="node-text">command joystick</text>

  <rect x="790" y="590" width="260" height="56" rx="7" class="firmware"/>
  <text x="920" y="611" class="node-text">Motor dan servo</text>
  <text x="920" y="631" class="node-text">bergerak</text>

  <rect x="1210" y="590" width="260" height="56" rx="7" class="monitor"/>
  <text x="1340" y="611" class="node-text">UI update speed,</text>
  <text x="1340" y="631" class="node-text">heading, GPS</text>

  <rect x="90" y="685" width="240" height="56" rx="7" class="app"/>
  <text x="210" y="713" class="node-text">Mode GRID / ROUTE</text>

  <polygon points="550,660 660,713 550,766 440,713" class="decision"/>
  <text x="550" y="695" class="node-text">GPS lock, koordinat,</text>
  <text x="550" y="716" class="node-text">waypoint &gt;= 2?</text>

  <rect x="430" y="805" width="240" height="56" rx="7" class="warn"/>
  <text x="550" y="826" class="node-text">Notif validasi gagal</text>
  <text x="550" y="846" class="node-text">GPS / waypoint belum siap</text>

  <rect x="790" y="685" width="260" height="56" rx="7" class="backend"/>
  <text x="920" y="705" class="node-text">Create route backend</text>
  <text x="920" y="726" class="node-text">dan start via MQTT</text>

  <rect x="790" y="780" width="260" height="70" rx="7" class="firmware"/>
  <text x="920" y="799" class="node-text">Firmware validasi route</text>
  <text x="920" y="820" class="node-text">simpan home point</text>
  <text x="920" y="841" class="node-text">mode AUTO + route_start</text>

  <rect x="790" y="890" width="260" height="70" rx="7" class="firmware"/>
  <text x="920" y="909" class="node-text">Autopilot ke waypoint</text>
  <text x="920" y="930" class="node-text">PI steering, fuzzy speed,</text>
  <text x="920" y="951" class="node-text">obstacle avoidance</text>

  <rect x="1210" y="770" width="260" height="70" rx="7" class="monitor"/>
  <text x="1340" y="790" class="node-text">UI tampilkan event</text>
  <text x="1340" y="811" class="node-text">route_start, wp_reached,</text>
  <text x="1340" y="832" class="node-text">route_complete/reject</text>

  <rect x="1060" y="1012" width="150" height="46" rx="7" class="firmware"/>
  <text x="1135" y="1026" class="small-text">Lanjut</text>
  <text x="1135" y="1046" class="small-text">autopilot</text>

  <polygon points="920,980 1040,1035 920,1090 800,1035" class="decision"/>
  <text x="920" y="1015" class="node-text">WiFi hilang</text>
  <text x="920" y="1036" class="node-text">&gt; 5 detik saat</text>
  <text x="920" y="1057" class="node-text">MODE_AUTO?</text>

  <polygon points="920,1115 1035,1170 920,1225 805,1170" class="decision"/>
  <text x="920" y="1160" class="node-text">Home point</text>
  <text x="920" y="1181" class="node-text">tersedia?</text>

  <rect x="740" y="1245" width="175" height="62" rx="7" class="warn"/>
  <text x="827" y="1266" class="small-text">RTH ditolak</text>
  <text x="827" y="1288" class="small-text">home_not_set</text>

  <rect x="935" y="1245" width="175" height="62" rx="7" class="rth"/>
  <text x="1022" y="1266" class="small-text">Waypoint home</text>
  <text x="1022" y="1288" class="small-text">mode RTH</text>

  <rect x="1210" y="1240" width="260" height="70" rx="7" class="monitor"/>
  <text x="1340" y="1260" class="node-text">Telemetry RTH</text>
  <text x="1340" y="1281" class="node-text">mode=rth, rth_active,</text>
  <text x="1340" y="1302" class="node-text">home_set, home_lat/lng</text>

  <rect x="1210" y="1330" width="260" height="56" rx="7" class="rth"/>
  <text x="1340" y="1351" class="node-text">Home tercapai</text>
  <text x="1340" y="1371" class="node-text">rth_complete + stop</text>

  <rect x="90" y="1345" width="240" height="56" rx="7" class="warn"/>
  <text x="210" y="1373" class="node-text">Emergency Stop</text>

  <rect x="430" y="1345" width="240" height="56" rx="7" class="warn"/>
  <text x="550" y="1373" class="node-text">Kirim command stop</text>

  <rect x="790" y="1365" width="260" height="36" rx="7" class="warn"/>
  <text x="920" y="1383" class="small-text">Throttle 0, steering center, mode IDLE</text>

  <path d="M330 198 L430 198" class="flow"/>
  <path d="M550 226 L550 255" class="flow"/>
  <path d="M550 311 L550 350" class="flow"/>
  <path d="M445 405 L315 405" class="flow"/>
  <rect x="352" y="380" width="34" height="20" rx="4" class="label-bg"/>
  <text x="365" y="385" class="label">Ya</text>
  <path d="M655 405 L790 393" class="flow"/>
  <rect x="700" y="374" width="48" height="20" rx="4" class="label-bg"/>
  <text x="706" y="379" class="label">Tidak</text>

  <path d="M210 460 L210 510" class="flow"/>
  <path d="M105 405 L60 405 L60 713 L90 713" class="flow"/>
  <path d="M105 405 L45 405 L45 1373 L90 1373" class="flow"/>

  <path d="M330 538 L430 538" class="flow"/>
  <path d="M670 538 L790 538" class="flow"/>
  <path d="M920 566 L920 590" class="flow"/>
  <path d="M1050 618 L1210 618" class="flow"/>
  <rect x="1080" y="585" width="86" height="20" rx="4" class="label-bg"/>
  <text x="1086" y="590" class="label">status MQTT</text>

  <path d="M330 713 L440 713" class="flow"/>
  <path d="M660 713 L790 713" class="flow"/>
  <rect x="686" y="682" width="34" height="20" rx="4" class="label-bg"/>
  <text x="692" y="694" class="label">Ya</text>
  <path d="M550 766 L550 805" class="flow"/>
  <rect x="579" y="779" width="48" height="20" rx="4" class="label-bg"/>
  <text x="585" y="784" class="label">Tidak</text>
  <path d="M920 741 L920 780" class="flow"/>
  <path d="M1050 815 L1210 805" class="flow"/>
  <rect x="1082" y="772" width="48" height="20" rx="4" class="label-bg"/>
  <text x="1088" y="777" class="label">event</text>
  <path d="M920 850 L920 890" class="flow"/>

  <path d="M920 960 L920 980" class="soft-flow"/>
  <rect x="948" y="956" width="112" height="20" rx="4" class="label-bg"/>
  <text x="954" y="961" class="label">monitor failsafe</text>
  <path d="M1040 1035 L1060 1035" class="soft-flow"/>
  <rect x="1048" y="1003" width="48" height="20" rx="4" class="label-bg"/>
  <text x="1054" y="1008" class="label">Tidak</text>
  <path d="M920 1090 L920 1115" class="flow"/>
  <rect x="944" y="1097" width="34" height="20" rx="4" class="label-bg"/>
  <text x="951" y="1102" class="label">Ya</text>
  <path d="M805 1170 L827 1170 L827 1245" class="flow"/>
  <rect x="760" y="1137" width="48" height="20" rx="4" class="label-bg"/>
  <text x="766" y="1142" class="label">Tidak</text>
  <path d="M1035 1170 L1022 1170 L1022 1245" class="flow"/>
  <rect x="1048" y="1137" width="34" height="20" rx="4" class="label-bg"/>
  <text x="1055" y="1142" class="label">Ya</text>
  <path d="M1110 1276 L1210 1276" class="flow"/>
  <path d="M1022 1307 L1022 1358 L1210 1358" class="flow"/>
  <path d="M827 1307 L827 1340 L920 1340 L920 1365" class="soft-flow"/>
  <path d="M1340 1386 L1340 1420 L920 1420 L920 1401" class="soft-flow"/>

  <path d="M330 1373 L430 1373" class="flow"/>
  <path d="M670 1373 L725 1373 L725 1383 L790 1383" class="flow"/>

  <text x="60" y="1465" class="subtitle">Catatan: home point dibuat saat route start berhasil. RTH otomatis aktif saat WiFi hilang ketika mode AUTO; jika home belum tersedia, firmware mengirim rth_reject.</text>
</svg>
